[project]
name = "factbase"
version = "0.1.0"
description = "A long-horizon memory layer for streams of facts, market data, documents and conversations, with the evaluation suite that produced it."
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "tqdm>=4.70.1",
]
